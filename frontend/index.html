<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EcoCusco - Plataforma inteligente de gestión ambiental y recolección de residuos sólidos segregados">
  <meta name="theme-color" content="#1b7345">
  <title>EcoCusco - Gestión Ambiental Urbana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
     body { margin: 0; background: #f0f5f2; font-family: Inter, Segoe UI, system-ui, sans-serif; min-height: 100vh; }
     #root { min-height: 100vh; }
     .loading { text-align: center; }
     .loading h2 { font-size: 28px; font-weight: 800; color: #1b7345; margin: 0 0 6px; letter-spacing: -0.02em; }
     .loading h2 span { color: #c49a30; }
     .loading p { font-size: 14px; color: #5a6670; margin: 0 0 24px; font-weight: 400; }
     .spinner { width: 44px; height: 44px; border: 3px solid rgba(27,115,69,0.1); border-top-color: #1b7345; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 24px; }
     @keyframes spin { to { transform: rotate(360deg); } }
   </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
      <h2>Eco<span>Cusco</span></h2>
      <p>Gestión Ambiental Urbana</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
