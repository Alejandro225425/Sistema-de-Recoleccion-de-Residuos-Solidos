<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EcoCusco - Plataforma inteligente de gestión ambiental y recolección de residuos sólidos segregados">
  <meta name="theme-color" content="#1b7345">
  <title>EcoCusco - Gestión Ambiental Urbana</title>
  <style>
    body {
      margin: 0;
      background: #f0f5f2;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .loading {
      text-align: center;
      color: #1b7345;
    }
    .loading p {
      font-size: 1.2rem;
      margin: 0 0 10px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e0e7e3;
      border-top-color: #1b7345;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <p>🌿 EcoCusco</p>
      <div class="spinner"></div>
      <p>Cargando plataforma...</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
